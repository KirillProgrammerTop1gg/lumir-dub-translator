[project]
name = "lumir-dub-translator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = ["fastapi>=0.115,<0.120", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
ml = ["whisperx>=3.4,<4"]
test = ["httpx>=0.28,<1", "pytest>=8,<10"]

[project.scripts]
lumir-api = "app.api:run"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
